reference_values:
  - {value: 20.93, name: m_dot_design_corrected_kg_s_Suder1995}
tolerance: 0.04             # 4% relative; Suder corrected vs design spread
source: "Suder 1995 ASME J. Turbomachinery 117(4):491-505, DOI 10.1115/1.2836561,
  Table 1 — corrected design mass flow = 20.93 kg/s (corrected to inlet
  P0=101325 Pa / T0=288.15 K). Moore & Reid 1980 NASA-TP-1659 reports
  uncorrected design mass flow ≈ 20.7 kg/s. The 'corrected' baseline is the
  Suder 1995 canonical for sweep normalization; 4% tolerance absorbs the
  corrected-vs-uncorrected spread (~1%)."
literature_doi: "10.1115/1.2836561"
mesh_info:
  cells: 1000000
  type: structured
  y_plus_wall: 1.0
solver_info:
  name: "STAR-CCM+ 2402 Steady Coupled"
  schemes: COUPLED
  turbulence_model: "k-omega SST"
  notes: "Choked operating point; mass flow 由 inlet 抽气流量计读数校核.
    Suder 1995 'corrected mass flow' 已归一化到 P0=101325 Pa / T0=288.15 K inlet
    条件, 与 Moore-Reid 1980 实验设计点同条件, 差异 ~1% 来自测量系统."
  platform: "Windows + Codebuddy REPL"
attestor_thresholds:
  reference_id: "circular_cylinder_wake"  # 0.03 公差
  tolerance_floor: 0.04                   # 略放宽吸收 corrected vs uncorrected 差异
  residual_floor: 1.0e-4
case_info:
  id: rotor37
  flow_type: COMPRESSIBLE
  geometry_type: IMPORTED_GEOMETRY
  steady_state: STEADY
  operating_point: design

