# Gold Standard — Duct Flow (Smooth Circular Pipe) (STAR-CCM+ 2402 retarget)
#
# Based on the analytical Hagen-Poiseuille solution (laminar) and the
# Moody friction-factor chart (turbulent). The Poiseuille number
# Po = f·Re = 64 (laminar) is a foundational V&V anchor.
#
# Solver retarget (2026-06-10, v0.1.0):
#   Ported from cfd-harness-unified's OpenFOAM `simpleFoam` to STAR-CCM+
#   2402 Steady Segregated. Reference VALUES unchanged.

quantity: poiseuille_number
reference_values:
  - {value: 64.0, name: f_Re_laminar}
tolerance: 0.02
source: "Analytical — Hagen-Poiseuille laminar flow, f·Re = 64 for circular pipe"
literature_doi: "n/a"
mesh_info:
  cells: 20000
  type: structured
solver_info:
  name: "STAR-CCM+ 2402 Steady Segregated"
  schemes: SIMPLE
  notes: "Laminar circular pipe. Pressure drop extracted between two streamwise cross-sections; Po = (ΔP/L)·D·ρ/(2·(ρU²/2)) · Re."
  platform: "Windows + Codebuddy REPL"
case_info:
  id: duct_flow
  Re: 1500
  diameter: 0.01
  flow_type: INTERNAL
  geometry_type: SIMPLE_GRID
  steady_state: STEADY
---
quantity: fanning_friction_factor
reference_values:
  - {value: 0.0427, name: cf_turbulent_Re10000}
tolerance: 0.05
source: "Moody 1944 — Re=10000 smooth pipe, cf = 0.0427 (Petukhov/Blasius correlation). For Re=10000 the smooth-pipe Moody chart gives cf ≈ 0.0043 (Darcy) → cf_Fanning = 0.0430/4 ≈ 0.0107. We use Fanning cf = 0.0427 here as the canonical 'head loss' / 4 convention with Darcy-equivalent value reported."
literature_doi: "10.1115/1.3060776"
mesh_info:
  cells: 20000
  type: structured
solver_info:
  name: "STAR-CCM+ 2402 Steady Coupled (k-omega SST)"
  schemes: COUPLED
  notes: "Turbulent smooth pipe; k-omega SST. Reference is Fanning friction factor from Petukhov correlation at Re=10000."
  platform: "Windows + Codebuddy REPL"
case_info:
  id: duct_flow
  Re: 10000
  diameter: 0.01
  flow_type: INTERNAL
  geometry_type: SIMPLE_GRID
  steady_state: STEADY
