# Gold Standard — NASA Rotor 37 Transonic Axial Compressor (Stage 3+)
#
# NASA Rotor 37 是 NASA Lewis Research Center 1970s 高负荷跨声速单级压气机
# 转子,36 叶片,设计转速 17188.7 rpm,叶尖速度 454 m/s,设计工况
# mass flow 20.93 kg/s (Suder 1995 corrected baseline), 设计压比 2.056
# (Suder 1995 Table 1 / Moore-Reid 1980 NASA-TP-1659), 等熵效率 0.876
# (Suder 1995 Table 1 peak efficiency). 跨声速激波 + 叶尖泄漏 + 角区分离
# 是验证重点.
#
# 引用文献 (priority order):
#   [1] Moore R D, Reid L. "Performance of single-stage axial-flow transonic
#       compressor with rotor and stator aspect ratios of 1.19 and 1.26,
#       respectively, and with design pressure ratio of 2.05".
#       NASA-TP-1659, 1980.  ← NASA Rotor 37 single-stage 原始实验
#       (NASA-TP-1338 是 4-stage high-pressure-ratio core compressor, 不是 R37)
#   [2] Suder K L, Chima R V, Strazisar A J, Roberts W B. "The effect of adding
#       roughness and thickness to a transonic axial compressor rotor".
#       ASME J. Turbomachinery 117(4):491-505, 1995. DOI: 10.1115/1.2836561
#       ← 实验包线 + corrected mass flow baseline (20.93 kg/s) +
#       3 speed lines (100% / 90% / 80%) Table 1
#   [3] Reid L, Moore R D. "Design and overall performance of four highly
#       loaded, high-speed inlet stages for an advanced high-pressure-ratio
#       core compressor". NASA-TP-1337, 1978.  ← 4 stages 系列设计点
#       (stage PR 1.82; NOT Rotor 37 alone — cited for context only)
#   [4] NUMECA/FINE Rotor37 tutorial (2011+, NUMECA 官方教学包). ← 转子几何
#       (IGES/GeomTurbo) + 验证 baseline
#
# Solver retarget: STAR-CCM+ 19.02.009 (2402) R8 Steady Coupled (compressible,
# Frozen Rotor);跨声速必须 Coupled + k-omega SST(沿用 track-c 草稿 DEC-007
# v8 共识).
#
# V&V 完整性:本文件按 scalar 路径设计点单点 + 3 个 characteristic_map
# speed-line peak 点起步 — fan_blade 的核心判定量 "特性曲线 sweep"
# 不在现有 schema 内,需要先扩 `GoldStandardComparator` 加 `sweep` quantity
# (track-c §3 B1). 等 schema 扩展后,再加 `rotor37_sweep.yaml` 走新 quantity 类型.
# 当前 characteristic_map_eta_speed_* / characteristic_map_PR_speed_* 是 scalar
# 单点对比,适配现有 comparator scalar 路径 (line 143-159) — 不抛 ValueError.
#
# Cross-references:
#   - AGENTS.md §"V&V loop is solver-agnostic" + §"Crew directives" 第 4 条
#     (数字必须有 literature 引用, 不允许编造)
#   - DEC-008 §2.4 STAR-CCM+ API 补全策略 (B: 暂不补)
#   - DEC-008 §4 影响面 "gold_standards/rotor37.yaml 新增"
#   - reports/research/commercial-fan-prop/planning/track-c-deliverable.md §2
#   - reports/research/commercial-fan-prop/planning/d1-plaid-probe.md
#     (PLAID = Safran RANS 仿真, 非 NASA 实验 gold, 不能替代此文件数字)
#
# Status: 7 月立项期 P1 stub scaffold. design point scalar path 已经数字落定;
# sweep quantity 等 track-c §3 B1 schema 扩展 (8-9 月分阶段).

# ---- 1) 设计点:总压比 (canonical rotor total-to-total) ----
quantity: total_pressure_ratio_design
reference_values:
  - {value: 2.056, name: PR_design_rotor37_total_to_total}
tolerance: 0.03              # 3% relative; cross-source spread 2.05-2.106
source: "Moore & Reid 1980, NASA-TP-1659 — single-stage axial flow transonic
  compressor with design pressure ratio of 2.05 (rotor total-to-total = 2.056,
  consistent with Suder 1995 ASME J. Turbomachinery 117(4):491 Table 1
  design point row). NASA-TP-1338 (1978) is the FOUR-stage core compressor
  report (stage PR 1.82), NOT Rotor 37 alone; cited in track-a-deliverable.md
  E-1 only for context."
literature_doi: "NASA NTRS (NASA-TP-1659 1980, public domain)"
mesh_info:
  cells: 1000000             # Suder 1995 验证用 1M cells 单通道; NUMECA 教学包 3 套网格 1.06M/2.15M/4.35M
  type: structured           # O-H / H-I 拓扑 (NUMECA AutoGrid 教学包默认)
  y_plus_wall: 1.0
  tip_clearance_cells: 10
solver_info:
  name: "STAR-CCM+ 19.02.009 (2402) R8 Steady Coupled (compressible, Frozen Rotor)"
  schemes: COUPLED
  turbulence_model: "k-omega SST"
  notes: "跨声速冻结转子; 入口总压/总温, 出口质量流量 (choked 时退化为静压).
    Mass-averaged PR 由 STAR-CCM+ SurfaceIntegralReport 提取.
    Solver retarget 待 DEC-007 Rotor37 真实求解跑通后填回 (沿用 track-c 草稿)."
  platform: "Windows + Codebuddy REPL"
attestor_thresholds:
  reference_id: "circular_cylinder_wake"   # 0.03 / 1e-4 RANS 公差作为扇叶单点 baseline
  tolerance_floor: 0.03
  residual_floor: 1.0e-4
case_info:
  id: rotor37
  flow_type: COMPRESSIBLE
  geometry_type: IMPORTED_GEOMETRY     # IGS / GeomTurbo / NUMECA AutoGrid
  steady_state: STEADY
  rotor:
    blades: 36
    design_rpm: 17188.7
    tip_speed_m_s: 454.0
    tip_clearance_mm: 0.356
    shroud_max_diameter_m: 0.51
    aspect_ratio: 1.19                 # NASA-TP-1659 标题明示 (rotor)
  inlet_bc:
    type: StagnationInlet
    p0_pa: 101325.0
    T0_k: 288.15
  outlet_bc:
    type: MassFlowOutlet
    mass_flow_kg_s: 20.93               # Suder 1995 corrected baseline
  operating_point: design

---
# ---- 2) 设计点:等熵效率 (canonical rotor peak) ----
quantity: isentropic_efficiency_design
reference_values:
  - {value: 0.876, name: eta_is_design_peak_efficiency_NASA_canonical}
tolerance: 0.05             # 5% relative; cross-source spread 0.85-0.88
source: "Suder 1995 ASME J. Turbomachinery 117(4):491-505, DOI 10.1115/1.2836561,
  Table 1 — design point peak efficiency = 0.876 (rotor 37 corrected operating
  condition, 100% design speed). Moore & Reid 1980 NASA-TP-1659 reports the
  same peak efficiency baseline. NUMECA/FINE Rotor37 tutorial uses 0.877 as
  numerical reference; within 5% tolerance."
literature_doi: "10.1115/1.2836561"
mesh_info:
  cells: 1000000
  type: structured
  y_plus_wall: 1.0
solver_info:
  name: "STAR-CCM+ 2402 Steady Coupled (compressible, Frozen Rotor)"
  schemes: COUPLED
  turbulence_model: "k-omega SST"
  notes: "eta_is = (h02s - h01)/(h02 - h01); 提取自入口/出口 SurfaceIntegralReport
    的 mass-averaged total enthalpy. NUMECA 验证: CFD 普遍低于实验 ~3% (AGARD AR-355)."
  platform: "Windows + Codebuddy REPL"
attestor_thresholds:
  reference_id: "turbulent_flat_plate"  # 公差 0.05 (default for RANS)
  tolerance_floor: 0.05
  residual_floor: 1.0e-5
case_info:
  id: rotor37
  flow_type: COMPRESSIBLE
  geometry_type: IMPORTED_GEOMETRY
  steady_state: STEADY
  operating_point: design

